<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Michelin Star · Étoile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none !important;
        }

        html,
        body {
            background: #0a0806;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0806;
        }
        ::-webkit-scrollbar-thumb {
            background: #c8a87c;
            border-radius: 2px;
        }

        #magnetic-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(200, 168, 124, 0.6), rgba(200, 168, 124, 0.1));
            border: 1px solid rgba(200, 168, 124, 0.4);
            backdrop-filter: blur(2px);
            transform: translate(-50%, -50%);
            transition: width 0.3s ease, height 0.3s ease, background 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 0 40px rgba(200, 168, 124, 0.15), inset 0 0 20px rgba(200, 168, 124, 0.05);
            will-change: transform, width, height;
        }
        #magnetic-cursor.active {
            width: 64px;
            height: 64px;
            background: radial-gradient(circle at 30% 30%, rgba(200, 168, 124, 0.8), rgba(200, 168, 124, 0.2));
            border-color: rgba(200, 168, 124, 0.8);
            box-shadow: 0 0 80px rgba(200, 168, 124, 0.3), inset 0 0 40px rgba(200, 168, 124, 0.1);
        }
        #magnetic-cursor .dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #c8a87c;
            opacity: 0.8;
            transition: width 0.3s ease, height 0.3s ease, opacity 0.3s ease;
        }
        #magnetic-cursor.active .dot {
            width: 8px;
            height: 8px;
            opacity: 1;
        }

        .hero-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
            padding: 2rem;
            text-align: center;
            mix-blend-mode: difference;
        }
        .hero-text h1 {
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 400;
            letter-spacing: 0.04em;
            color: #f5efe8;
            text-shadow: 0 0 80px rgba(200, 168, 124, 0.15);
            opacity: 0;
            transform: translateY(40px) scale(0.96);
        }
        .hero-text h1 .accent {
            color: #c8a87c;
            font-style: italic;
        }
        .hero-text .sub {
            font-size: clamp(0.9rem, 1.4vw, 1.4rem);
            letter-spacing: 0.6em;
            text-transform: uppercase;
            color: rgba(245, 239, 232, 0.5);
            margin-top: 1rem;
            opacity: 0;
            transform: translateY(20px);
            font-weight: 300;
        }
        .hero-text .line {
            width: 60px;
            height: 1px;
            background: rgba(200, 168, 124, 0.3);
            margin: 1.5rem auto;
            opacity: 0;
            transform: scaleX(0);
        }
        .hero-text .scroll-hint {
            position: absolute;
            bottom: 3rem;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(245, 239, 232, 0.2);
            opacity: 0;
            animation: breathe 3s ease-in-out infinite;
        }
        @keyframes breathe {
            0%,
            100% {
                opacity: 0.2;
            }
            50% {
                opacity: 0.6;
            }
        }

        .scroll-spacer {
            height: 200vh;
            position: relative;
            z-index: 1;
            pointer-events: none;
        }

        #loader {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #0a0806;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.2s ease, visibility 1.2s ease;
            pointer-events: none;
        }
        #loader.hidden {
            opacity: 0;
            visibility: hidden;
        }
        #loader .ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 1px solid rgba(200, 168, 124, 0.15);
            border-top-color: #c8a87c;
            animation: spin 1.2s cubic-bezier(0.6, 0, 0.4, 1) infinite;
        }
        #loader .label {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(200, 168, 124, 0.4);
            font-weight: 300;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .hero-text h1 {
                font-size: clamp(2.5rem, 10vw, 4rem);
            }
            .hero-text .sub {
                font-size: 0.7rem;
                letter-spacing: 0.4em;
            }
            #magnetic-cursor {
                display: none;
            }
        }
        @media (max-width: 480px) {
            .hero-text h1 {
                font-size: 2rem;
            }
            .hero-text .sub {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- LOADER -->
    <div id="loader">
        <div class="ring"></div>
        <div class="label">Préparation</div>
    </div>

    <!-- MAGNETIC CURSOR -->
    <div id="magnetic-cursor">
        <div class="dot"></div>
    </div>

    <!-- HERO TEXT OVERLAY -->
    <div class="hero-text" id="hero-text">
        <h1 id="main-title">
            <span class="accent">É</span>toile
        </h1>
        <div class="line" id="title-line"></div>
        <p class="sub" id="sub-title">Gastronomie · Art · Émotion</p>
        <div class="scroll-hint" id="scroll-hint">Défilez pour découvrir</div>
    </div>

    <!-- SCROLL SPACER -->
    <div class="scroll-spacer" id="scroll-spacer"></div>

    <!-- REACT + THREE MOUNT -->
    <div id="three-root" style="position:fixed;top:0;left:0;width:100%;height:100vh;z-index:0;"></div>

    <!-- SCRIPTS -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://cdn.jsdelivr.net/npm/react@18.2.0/+esm",
                "react-dom": "https://cdn.jsdelivr.net/npm/react-dom@18.2.0/+esm",
                "react/jsx-runtime": "https://cdn.jsdelivr.net/npm/react@18.2.0/jsx-runtime/+esm",
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "@react-three/fiber": "https://cdn.jsdelivr.net/npm/@react-three/fiber@8.15.19/+esm",
                "@react-three/drei": "https://cdn.jsdelivr.net/npm/@react-three/drei@9.88.24/+esm",
                "@react-three/postprocessing": "https://cdn.jsdelivr.net/npm/@react-three/postprocessing@2.16.2/+esm",
                "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/+esm",
                "gsap/ScrollTrigger": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/ScrollTrigger/+esm",
                "three-stdlib": "https://cdn.jsdelivr.net/npm/three-stdlib@2.28.6/+esm",
                "leva": "https://cdn.jsdelivr.net/npm/leva@0.9.35/+esm"
            }
        }
    </script>

    <script type="module">
        import React from 'react';
        import ReactDOM from 'react-dom/client';
        import { Canvas, useFrame, useThree } from '@react-three/fiber';
        import { OrbitControls, Environment, useProgress, Html } from '@react-three/drei';
        import { EffectComposer, Bloom, ChromaticAberration } from '@react-three/postprocessing';
        import * as THREE from 'three';
        import gsap from 'gsap';
        import { ScrollTrigger } from 'gsap/ScrollTrigger';
        import { Suspense, useRef, useMemo, useState, useEffect, useCallback } from 'react';

        gsap.registerPlugin(ScrollTrigger);

        // ─── SHADERS ────────────────────────────────────────────────

        const vertexShader = `
          uniform float uTime;
          uniform vec2 uMouse;
          uniform float uDistortion;

          attribute float aSize;
          attribute vec3 aRandom;
          attribute float aPhase;

          varying float vAlpha;
          varying vec3 vColor;

          void main() {
            vec3 pos = position;

            // spherical distortion based on mouse
            float dist = length(pos);
            float angle = atan(pos.y, pos.x);
            float elevation = asin(pos.z / dist);

            float influence = 1.0 - smoothstep(0.0, 2.0, dist);
            float wave = sin(uTime * 0.6 + dist * 4.0 + aPhase) * 0.08 * uDistortion;

            // mouse warp
            vec2 mouseDir = uMouse * 2.0 - 1.0;
            float mouseInfluence = 0.3 * uDistortion;
            float angleOffset = mouseDir.x * 0.6 * influence;
            float elevOffset = mouseDir.y * 0.4 * influence;

            angle += angleOffset + wave * 0.5;
            elevation += elevOffset + wave * 0.3;

            // rebuild position
            float r = dist + wave * 0.4;
            pos.x = r * cos(elevation) * cos(angle);
            pos.y = r * sin(elevation);
            pos.z = r * cos(elevation) * sin(angle);

            // add some random jitter from mouse
            pos += aRandom * 0.04 * uDistortion * mouseInfluence;

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            vec4 projected = projectionMatrix * mvPosition;
            gl_Position = projected;

            float size = aSize * (300.0 / -mvPosition.z) * (1.0 + 0.3 * uDistortion);
            gl_PointSize = clamp(size, 1.0, 60.0);

            vAlpha = 0.5 + 0.5 * sin(uTime * 0.3 + aPhase + dist * 2.0);
            vColor = 0.5 + 0.5 * sin(vec3(0.7, 0.9, 1.2) * uTime * 0.1 + aPhase + dist);
            vColor = mix(vColor, vec3(0.85, 0.72, 0.55), 0.3);
          }
        `;

        const fragmentShader = `
          uniform float uTime;
          varying float vAlpha;
          varying vec3 vColor;

          void main() {
            vec2 center = gl_PointCoord - 0.5;
            float d = length(center);
            if (d > 0.5) discard;

            float glow = 1.0 - smoothstep(0.0, 0.5, d);
            float core = 1.0 - smoothstep(0.0, 0.15, d);

            vec3 color = mix(vColor, vec3(1.0), core * 0.5);
            float alpha = glow * vAlpha * 0.85;

            // shimmer
            float shimmer = sin(gl_PointCoord.x * 40.0 + uTime * 0.5) * 0.1 + 0.9;
            color *= shimmer;

            gl_FragColor = vec4(color, alpha);
          }
        `;

        const dustVertex = `
          uniform float uTime;
          uniform float uSpread;

          attribute float aSize;
          attribute vec3 aVelocity;

          varying float vAlpha;

          void main() {
            vec3 pos = position + aVelocity * uSpread;

            // ambient drift
            pos.x += sin(uTime * 0.1 + position.y * 0.5) * 0.3;
            pos.y += cos(uTime * 0.08 + position.x * 0.4) * 0.3;
            pos.z += sin(uTime * 0.06 + position.x * 0.3 + position.y * 0.3) * 0.3;

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPosition;

            float size = aSize * (200.0 / -mvPosition.z);
            gl_PointSize = clamp(size, 0.5, 30.0);

            vAlpha = 0.1 + 0.15 * sin(uTime * 0.05 + position.x + position.y);
          }
        `;

        const dustFragment = `
          varying float vAlpha;

          void main() {
            vec2 center = gl_PointCoord - 0.5;
            float d = length(center);
            if (d > 0.5) discard;

            float glow = 1.0 - smoothstep(0.0, 0.5, d);
            vec3 color = vec3(0.85, 0.75, 0.62);
            float alpha = glow * vAlpha * 0.6;

            gl_FragColor = vec4(color, alpha);
          }
        `;

        // ─── COMPONENTS ─────────────────────────────────────────────

        function ParticleSphere({ mouse, distortion, progress }) {
            const meshRef = useRef();
            const { camera } = useThree();

            const { positions, sizes, randoms, phases, velocities } = useMemo(() => {
                const count = 4500;
                const pos = new Float32Array(count * 3);
                const sizes = new Float32Array(count);
                const randoms = new Float32Array(count * 3);
                const phases = new Float32Array(count);
                const velocities = new Float32Array(count * 3);

                for (let i = 0; i < count; i++) {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const radius = 0.6 + Math.random() * 0.8;

                    pos[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                    pos[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                    pos[i * 3 + 2] = radius * Math.cos(phi);

                    sizes[i] = 0.03 + Math.random() * 0.08;
                    randoms[i * 3] = (Math.random() - 0.5) * 0.1;
                    randoms[i * 3 + 1] = (Math.random() - 0.5) * 0.1;
                    randoms[i * 3 + 2] = (Math.random() - 0.5) * 0.1;
                    phases[i] = Math.random() * Math.PI * 2;

                    const dir = new THREE.Vector3(
                        (Math.random() - 0.5) * 2,
                        (Math.random() - 0.5) * 2,
                        (Math.random() - 0.5) * 2
                    ).normalize().multiplyScalar(0.2 + Math.random() * 0.6);
                    velocities[i * 3] = dir.x;
                    velocities[i * 3 + 1] = dir.y;
                    velocities[i * 3 + 2] = dir.z;
                }

                return {
                    positions: pos,
                    sizes,
                    randoms,
                    phases,
                    velocities
                };
            }, []);

            const uniforms = useMemo(() => ({
                uTime: { value: 0 },
                uMouse: { value: new THREE.Vector2(0.5, 0.5) },
                uDistortion: { value: 0.2 },
            }), []);

            useFrame((state, delta) => {
                uniforms.uTime.value += delta * 0.6;
                if (mouse) {
                    uniforms.uMouse.value.lerp(mouse, 0.08);
                }
                const targetDist = 0.15 + distortion * 1.2;
                uniforms.uDistortion.value += (targetDist - uniforms.uDistortion.value) * 0.04;

                if (meshRef.current) {
                    meshRef.current.rotation.x += delta * 0.04;
                    meshRef.current.rotation.y += delta * 0.07;
                }

                // camera follow for scroll
                const scrollProgress = progress || 0;
                const camZ = 2.8 - scrollProgress * 2.4;
                const camY = 0.2 - scrollProgress * 0.6;
                camera.position.lerp(new THREE.Vector3(0, camY, camZ), 0.04);
                camera.lookAt(0, 0, 0);
            });

            const geometry = useMemo(() => {
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
                geo.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 3));
                geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
                return geo;
            }, [positions, sizes, randoms, phases]);

            return (
                <points ref={meshRef} geometry={geometry}>
                    <shaderMaterial
                        uniforms={uniforms}
                        vertexShader={vertexShader}
                        fragmentShader={fragmentShader}
                        transparent
                        blending={THREE.AdditiveBlending}
                        depthWrite={false}
                    />
                </points>
            );
        }

        function DustParticles({ spread }) {
            const ref = useRef();

            const { positions, sizes, velocities } = useMemo(() => {
                const count = 1200;
                const pos = new Float32Array(count * 3);
                const sizes = new Float32Array(count);
                const vel = new Float32Array(count * 3);

                for (let i = 0; i < count; i++) {
                    const radius = 0.8 + Math.random() * 2.5;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    pos[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                    pos[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                    pos[i * 3 + 2] = radius * Math.cos(phi);

                    sizes[i] = 0.01 + Math.random() * 0.04;
                    const dir = new THREE.Vector3(
                        (Math.random() - 0.5) * 2,
                        (Math.random() - 0.5) * 2,
                        (Math.random() - 0.5) * 2
                    ).normalize().multiplyScalar(0.3 + Math.random() * 1.2);
                    vel[i * 3] = dir.x;
                    vel[i * 3 + 1] = dir.y;
                    vel[i * 3 + 2] = dir.z;
                }

                return { positions: pos, sizes, velocities: vel };
            }, []);

            const uniforms = useMemo(() => ({
                uTime: { value: 0 },
                uSpread: { value: 0 },
            }), []);

            useFrame((state, delta) => {
                uniforms.uTime.value += delta * 0.15;
                const targetSpread = spread * 2.8;
                uniforms.uSpread.value += (targetSpread - uniforms.uSpread.value) * 0.06;

                if (ref.current) {
                    ref.current.rotation.x += delta * 0.008;
                    ref.current.rotation.y += delta * 0.012;
                }
            });

            const geo = useMemo(() => {
                const g = new THREE.BufferGeometry();
                g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                g.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
                g.setAttribute('aVelocity', new THREE.BufferAttribute(velocities, 3));
                return g;
            }, [positions, sizes, velocities]);

            return (
                <points ref={ref} geometry={geo}>
                    <shaderMaterial
                        uniforms={uniforms}
                        vertexShader={dustVertex}
                        fragmentShader={dustFragment}
                        transparent
                        blending={THREE.AdditiveBlending}
                        depthWrite={false}
                    />
                </points>
            );
        }

        function Scene({ mouse, distortion, progress, spread }) {
            const { camera } = useThree();

            useEffect(() => {
                camera.position.set(0, 0.2, 2.8);
                camera.lookAt(0, 0, 0);
            }, [camera]);

            return (
                <>
                    <color attach="background" args={['#0a0806']} />
                    <ambientLight intensity={0.4} color="#c8a87c" />
                    <pointLight position={[2, 3, 4]} intensity={0.8} color="#c8a87c" />
                    <pointLight position={[-3, -1, 2]} intensity={0.4} color="#8a7a6a" />

                    <ParticleSphere mouse={mouse} distortion={distortion} progress={progress} />
                    <DustParticles spread={spread} />

                    {/* subtle fog */}
                    <fog attach="fog" args={['#0a0806', 2.5, 6]} />

                    <EffectComposer>
                        <Bloom
                            intensity={0.25 + distortion * 0.2}
                            luminanceThreshold={0.15}
                            luminanceSmoothing={0.1}
                            radius={0.4}
                        />
                        <ChromaticAberration
                            offset={[0.0012 + distortion * 0.002, 0.0008 + distortion * 0.0015]}
                            radialModulation={true}
                            modulationOffset={0.3}
                        />
                    </EffectComposer>
                </>
            );
        }

        // ─── MAIN APP ──────────────────────────────────────────────

        function App() {
            const [mouse, setMouse] = useState(new THREE.Vector2(0.5, 0.5));
            const [distortion, setDistortion] = useState(0);
            const [progress, setProgress] = useState(0);
            const [spread, setSpread] = useState(0);
            const [loaded, setLoaded] = useState(false);

            const cursorRef = useRef(null);
            const textRefs = useRef({});
            const scrollRef = useRef(0);

            // ─── MOUSE TRACKING ─────────────────────────────────────

            useEffect(() => {
                const onMouseMove = (e) => {
                    const x = e.clientX / window.innerWidth;
                    const y = 1 - e.clientY / window.innerHeight;
                    setMouse(new THREE.Vector2(x, y));

                    // magnetic cursor
                    if (cursorRef.current) {
                        gsap.to(cursorRef.current, {
                            x: e.clientX,
                            y: e.clientY,
                            duration: 0.6,
                            ease: 'power3.out',
                            overwrite: 'auto'
                        });
                    }
                };

                const onMouseDown = () => {
                    if (cursorRef.current) {
                        cursorRef.current.classList.add('active');
                        setDistortion(d => Math.min(d + 0.6, 1.2));
                        setTimeout(() => {
                            if (cursorRef.current) cursorRef.current.classList.remove('active');
                        }, 400);
                        setTimeout(() => {
                            setDistortion(d => Math.max(d - 0.3, 0));
                        }, 500);
                    }
                };

                const onMouseUp = () => {
                    if (cursorRef.current) {
                        cursorRef.current.classList.remove('active');
                    }
                };

                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mousedown', onMouseDown);
                window.addEventListener('mouseup', onMouseUp);

                return () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mousedown', onMouseDown);
                    window.removeEventListener('mouseup', onMouseUp);
                };
            }, []);

            // ─── SCROLL ANIMATIONS ──────────────────────────────────

            useEffect(() => {
                const mainTitle = document.getElementById('main-title');
                const subTitle = document.getElementById('sub-title');
                const titleLine = document.getElementById('title-line');
                const scrollHint = document.getElementById('scroll-hint');

                const tl = gsap.timeline({
                    defaults: { ease: 'power3.out' }
                });

                // entry
                tl.to(mainTitle, {
                    opacity: 1,
                    y: 0,
                    scale: 1,
                    duration: 1.6,
                    delay: 0.6
                })
                .to(titleLine, {
                    opacity: 1,
                    scaleX: 1,
                    duration: 1.2,
                    ease: 'power2.out'
                }, '-=0.8')
                .to(subTitle, {
                    opacity: 1,
                    y: 0,
                    duration: 1.2
                }, '-=0.8')
                .to(scrollHint, {
                    opacity: 1,
                    duration: 1.4
                }, '-=0.6');

                // scroll-driven
                const scrollTl = gsap.timeline({
                    scrollTrigger: {
                        trigger: '#scroll-spacer',
                        start: 'top top',
                        end: 'bottom bottom',
                        scrub: 1.2,
                        onUpdate: (self) => {
                            const p = self.progress;
                            setProgress(p);
                            setSpread(p);
                            // distortion pulse from scroll
                            const d = 0.15 + p * 0.5 + 0.15 * Math.sin(p * Math.PI * 6);
                            setDistortion(d);
                            scrollRef.current = p;
                        }
                    }
                });

                // text transitions on scroll
                scrollTl
                    .to(mainTitle, {
                        scale: 0.7,
                        opacity: 0.2,
                        y: -80,
                        duration: 1,
                        ease: 'power2.inOut'
                    }, 0)
                    .to(subTitle, {
                        opacity: 0,
                        y: -30,
                        duration: 0.8,
                        ease: 'power2.inOut'
                    }, 0.1)
                    .to(titleLine, {
                        opacity: 0,
                        scaleX: 0.3,
                        duration: 0.8
                    }, 0.1)
                    .to(scrollHint, {
                        opacity: 0,
                        duration: 0.6
                    }, 0.2);

                // second text reveal (deeper)
                const secondaryText = document.createElement('div');
                secondaryText.className =
                    'absolute bottom-[20%] left-1/2 -translate-x-1/2 text-center pointer-events-none z-10 opacity-0';
                secondaryText.style.transition = 'opacity 1.2s ease';
                secondaryText.innerHTML = `
              <p class="font-serif text-[clamp(0.8rem,2vw,1.6rem)] text-[#c8a87c] tracking-[0.3em] uppercase font-light">
                Une expérience sensorielle
              </p>
              <div class="w-12 h-px bg-[rgba(200,168,124,0.2)] mx-auto mt-4"></div>
            `;
                document.body.appendChild(secondaryText);

                // fade in secondary text at ~60% scroll
                const obs = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const p = scrollRef.current;
                            if (p > 0.4) {
                                secondaryText.style.opacity = '1';
                            }
                        }
                    });
                }, { threshold: 0.1 });
                obs.observe(document.getElementById('scroll-spacer'));

                // also directly control via scroll trigger
                gsap.to(secondaryText, {
                    opacity: 1,
                    duration: 1.2,
                    ease: 'power2.out',
                    scrollTrigger: {
                        trigger: '#scroll-spacer',
                        start: '40% top',
                        end: '60% top',
                        scrub: 0.8
                    }
                });

                return () => {
                    tl.kill();
                    scrollTl.kill();
                    ScrollTrigger.getAll().forEach(st => st.kill());
                    if (secondaryText.parentNode) secondaryText.remove();
                    obs.disconnect();
                };
            }, []);

            // ─── LOADING ────────────────────────────────────────────

            useEffect(() => {
                const loader = document.getElementById('loader');
                // simulate loading
                const timer = setTimeout(() => {
                    if (loader) loader.classList.add('hidden');
                    setLoaded(true);
                }, 1200);

                return () => clearTimeout(timer);
            }, []);

            // ─── CURSOR REF ─────────────────────────────────────────

            useEffect(() => {
                cursorRef.current = document.getElementById('magnetic-cursor');
            }, []);

            // ─── RESPONSIVE / DPR ──────────────────────────────────

            const dpr = useMemo(() => {
                const d = window.devicePixelRatio || 1;
                const isMobile = window.innerWidth < 768;
                const isLowEnd = navigator.hardwareConcurrency && navigator.hardwareConcurrency < 4;
                if (isMobile || isLowEnd) return Math.min(d, 1.2);
                return Math.min(d, 2);
            }, []);

            return (
                <div style={{ position: 'fixed', inset: 0, zIndex: 0 }}>
                    <Canvas
                        dpr={dpr}
                        frameloop="always"
                        gl={{
                            antialias: dpr < 1.5 ? false : true,
                            powerPreference: 'high-performance',
                            alpha: false,
                            stencil: false,
                            depth: true,
                        }}
                        camera={{ position: [0, 0.2, 2.8], fov: 50 }}
                    >
                        <Suspense fallback={null}>
                            <Scene
                                mouse={mouse}
                                distortion={distortion}
                                progress={progress}
                                spread={spread}
                            />
                        </Suspense>
                    </Canvas>
                </div>
            );
        }

        // ─── MOUNT ──────────────────────────────────────────────────

        const root = ReactDOM.createRoot(document.getElementById('three-root'));
        root.render(React.createElement(App));

        // ─── CLEANUP ON UNLOAD ─────────────────────────────────────

        window.addEventListener('beforeunload', () => {
            ScrollTrigger.getAll().forEach(st => st.kill());
            gsap.globalTimeline.clear();
            // force dispose of Three.js contexts
            const canvas = document.querySelector('canvas');
            if (canvas) {
                const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
                if (gl) gl.getExtension('WEBGL_lose_context')?.loseContext();
            }
        });

        console.log('🍷 Étoile — Michelin Star Experience');
        console.log('✨ Crafted with React Three Fiber + GSAP + Shaders');
    </script>

</body>
</html>
