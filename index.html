<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXORA COFFEE | 3D Experience</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b231a; color: #fff; overflow-x: hidden; }
    canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
    
    /* Navigation */
    nav { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; padding: 20px 8%; z-index: 10; backdrop-filter: blur(10px); }
    .logo { font-weight: bold; font-size: 1.5rem; color: #d4af37; letter-spacing: 2px; }
    .nav-links { display: flex; gap: 20px; list-style: none; }
    .nav-links a { color: #fff; text-decoration: none; font-size: 0.9rem; }

    /* Content Sections */
    section { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; position: relative; z-index: 2; }
    
    /* Hero Section */
    .hero { align-items: flex-start; }
    .hero h1 { font-size: clamp(2.5rem, 6vw, 4.5rem); color: #fff; max-width: 600px; line-height: 1.1; }
    .hero h1 span { color: #d4af37; }
    .hero p { margin: 20px 0; color: #a3b8b0; max-width: 400px; font-size: 1.1rem; }
    .btn { padding: 12px 30px; background: #d4af37; color: #0b231a; font-weight: bold; border-radius: 25px; text-decoration: none; border: none; cursor: pointer; }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .hero { align-items: center; text-align: center; justify-content: flex-end; padding-bottom: 80px; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

  <canvas id="webgl"></canvas>

  <nav>
    <div class="logo">LUXORA</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Menu</a></li>
      <li><a href="#">Rewards</a></li>
    </ul>
  </nav>

  <section class="hero">
    <h1>PURE JOY IN <span>EVERY SIP</span></h1>
    <p>Handcrafted luxury coffee perfected daily for your ultimate taste.</p>
    <button class="btn">Order Now</button>
  </section>

  <section class="details">
    <h2 style="font-size: 2.5rem; color: #d4af37;">SIGNATURE CREATIONS</h2>
    <p style="color: #a3b8b0; margin-top: 10px;">Experience our 3D interactive espresso blends.</p>
  </section>

  <script>
    // 1. Scene Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl'), alpha: true, antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // 2. 3D Coffee Cup (Stylized Geometry)
    const cupGroup = new THREE.Group();
    
    // Cup Body
    const cupGeo = new THREE.CylinderGeometry(1.2, 0.8, 2.5, 32);
    const cupMat = new THREE.MeshPhongMaterial({ color: 0xe6c280, transparent: true, opacity: 0.85 });
    const cup = new THREE.Mesh(cupGeo, cupMat);
    cupGroup.add(cup);

    // Coffee Beans (Floating Particles)
    const beanGeo = new THREE.SphereGeometry(0.15, 8, 8);
    beanGeo.scale(1, 0.6, 0.6);
    const beanMat = new THREE.MeshPhongMaterial({ color: 0x3d2314 });
    const beans = [];

    for(let i = 0; i < 15; i++) {
      const bean = new THREE.Mesh(beanGeo, beanMat);
      bean.position.set(
        (Math.random() - 0.5) * 6,
        (Math.random() - 0.5) * 6,
        (Math.random() - 0.5) * 4
      );
      bean.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      scene.add(bean);
      beans.push(bean);
    }

    scene.add(cupGroup);

    // 3. Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xd4af37, 1.5);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);

    camera.position.z = 5;

    // Responsive Positioning for Mobile / Desktop
    function adjustLayout() {
      if(window.innerWidth < 768) {
        cupGroup.position.set(0, 0.8, 0); // رفع الكوب لأعلى في الموبايل
        cupGroup.scale.set(0.8, 0.8, 0.8);
      } else {
        cupGroup.position.set(2, 0, 0); // وضع الكوب على اليمين في اللابتوب
        cupGroup.scale.set(1.1, 1.1, 1.1);
      }
    }
    adjustLayout();

    // 4. Scroll Animation (GSAP)
    gsap.registerPlugin(ScrollTrigger);

    gsap.to(cupGroup.rotation, {
      y: Math.PI * 2,
      x: 0.3,
      scrollTrigger: {
        trigger: ".details",
        start: "top bottom",
        end: "top top",
        scrub: 1
      }
    });

    beans.forEach((bean, i) => {
      gsap.to(bean.position, {
        y: bean.position.y + (i % 2 === 0 ? 2 : -2),
        rotation: Math.PI * 2,
        scrollTrigger: {
          trigger: "body",
          start: "top top",
          end: "bottom bottom",
          scrub: 1.5
        }
      });
    });

    // Render Loop
    function animate() {
      requestAnimationFrame(animate);
      cupGroup.rotation.y += 0.005; // دوران مستمر خفيف
      renderer.render(scene, camera);
    }
    animate();

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      adjustLayout();
    });
  </script>
</body>
</html>
